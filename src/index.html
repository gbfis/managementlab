  <!--
    KONFIGURASI GAS_API_URL (URL Web App Google Apps Script).
    1. Deploy project GAS (Code.gs) sebagai Web App:
       - "Execute as": Me
       - "Who has access": Anyone
    2. Salin URL Web App (format: https://script.google.com/macros/s/AKfyc.../exec)
    3. Isi attribute content di meta tag di bawah dengan URL tersebut.

    Untuk produksi di Cloudflare Pages: URL ini juga bisa diinjeksi sebagai
    environment variable (GAS_API_URL) lewat Cloudflare Pages Functions / build
    step yang menimpa nilai meta tag ini saat deploy.
    Untuk development: isi langsung di sini.

    Jika kosong, aplikasi tetap terbuka namun setiap permintaan API akan gagal.
  -->
  <meta name="gas-api-url" content="https://script.google.com/macros/s/AKfycbz_CUw3Nx8n2znnr-tiSiFqwap0RlI_6zGiK0AmtOc7ZdIvW0u5WRJaL647N2DFEbBTNQ/exec" id="gas-api-url">
